name: Fork Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Keep fork publishing separate from upstream's existing workflows.
    if: github.repository == 'JasdewStarfield/HMCL' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never
      - name: Build and test
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          # GITHUB_SHA gives each unofficial build a source-specific version.
          VERSION_TYPE: unofficial
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HMCL-fork-${{ github.sha }}
          path: HMCL/build/libs/HMCL-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: HMCL-fork-${{ github.sha }}
          path: dist
      - name: Verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Require every expected package and verify it before public release.
          for extension in jar exe sh deb; do
            files=(HMCL-*.$extension)
            test "${#files[@]}" -eq 1
            test -f "${files[0]}"
            checksum=$(tr -d '\r\n' < "${files[0]}.sha256")
            printf '%s  %s\n' "$checksum" "${files[0]}" | sha256sum --check
          done
      - name: Publish public prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # An attempt-specific tag keeps reruns from replacing earlier downloads.
          tag="fork-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          short_sha="${GITHUB_SHA:0:7}"
          notes="$RUNNER_TEMP/fork-release-notes.md"
          cat > "$notes" <<EOF
          HMCL 非官方构建，包含本分支的下载功能补丁。

          - 源码提交：[$GITHUB_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA)
          - 构建记录：[GitHub Actions](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)
          - Windows 用户可下载 EXE；已安装 Java 17 或更高版本的用户也可运行 JAR。
          - 本构建未使用官方签名，默认无法通过启动器内置更新切换到官方版本。
          - 附件提供 SHA-256 校验文件。
          EOF
          gh release create "$tag" dist/HMCL-* \
            --target "$GITHUB_SHA" \
            --title "HMCL unofficial $short_sha (build $GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT)" \
            --notes-file "$notes" \
            --prerelease \
            --latest=false
